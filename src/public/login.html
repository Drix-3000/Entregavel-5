
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Electro Store</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="logo">
            Electro<span>Store</span>
        </a>
        <a href="index.html" class="back-link">Voltar à loja</a>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-heading">
                <h1>Bem-vindo de volta!</h1>
                <p>Entre na sua conta para continuar comprando.</p>
            </div>

            <form action="#" method="POST">

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary">
                    Entrar
                </button>

            </form>

            <div class="auth-footer">
                <p>Não possui uma conta?</p>
                <a href="cadastro.html">Criar minha conta</a>
            </div>

        </section>

    </main>

    <footer class="auth-bottom">
        © 2026 Electro Store. Todos os direitos reservados.
    </footer>

</body>
</html>
