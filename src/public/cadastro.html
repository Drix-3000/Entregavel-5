
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Electro Store</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="logo">
            Electro<span>Store</span>
        </a>
        <a href="index.html" class="back-link">Voltar à loja</a>
    </header>

    <main class="auth-container">

        <section class="auth-card register-card">

            <div class="auth-heading">
                <h1>Crie sua conta</h1>
                <p>Cadastre-se para aproveitar nossas ofertas.</p>
            </div>

            <form id="cadastroForm">

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf"
                        placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone"
                        placeholder="(00) 00000-0000" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                        placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="Crie uma senha" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente" required>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        Li e aceito os termos de uso e a política de privacidade.
                    </label>
                </div>

                <p id="mensagemCadastro"></p>

                <button type="submit" class="btn-primary">
                    Criar minha conta
                </button>

            </form>

            <div class="auth-footer">
                <p>Já possui uma conta?</p>
                <a href="login.html">Fazer login</a>
            </div>

        </section>

    </main>

    <footer class="auth-bottom">
        © 2026 Electro Store. Todos os direitos reservados.
    </footer>

    <script src="./js/cadastro.js"></script>

</body>
</html>
